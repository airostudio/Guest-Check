version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: guestcheck_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-guestcheck}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-guestcheck_secret}
      POSTGRES_DB: ${POSTGRES_DB:-guestcheck}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: guestcheck_redis
    restart: unless-stopped
    ports:
      - '6379:6379'

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: guestcheck_server
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    ports:
      - '4000:4000'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-guestcheck}:${POSTGRES_PASSWORD:-guestcheck_secret}@postgres:5432/${POSTGRES_DB:-guestcheck}
      REDIS_URL: redis://redis:6379
    env_file:
      - ./server/.env
    volumes:
      - ./server:/app
      - /app/node_modules

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: guestcheck_client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - '3000:80'

volumes:
  postgres_data:
